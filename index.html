<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roommate Chore Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧹 Roommate Chore Tracker</h1>
    </header>

    <section id="leaderboard" class="leaderboard" aria-label="Roommate leaderboard"></section>

    <nav id="filterNav" class="filter-nav" aria-label="Filter chores"></nav>

    <section id="suggestionsSection" class="suggestions-section">
      <h2>Chore Suggestions</h2>
      <p class="suggestions-note">Suggest a chore for the house. Suggestions stay here until someone removes them or admin adds one to the board.</p>
      <form id="suggestionForm" class="suggestion-form">
        <input type="text" id="suggestionInput" placeholder="e.g. Deep clean the oven" required>
        <button type="submit">Suggest</button>
      </form>
      <div id="suggestionList"></div>
    </section>

    <section class="admin-controls">
      <button type="button" id="adminModeBtn" class="admin-mode-btn" aria-pressed="false">
        AM
      </button>
      <div id="loginWidget" class="login-widget" hidden>
        <input type="password" id="adminPinInput" placeholder="Enter PIN" autocomplete="off">
        <button type="button" id="adminSubmitBtn">Unlock</button>
      </div>
    </section>

    <section id="adminPanel" class="admin-panel" hidden>
      <h2>Add New Chore</h2>
      <form id="addChoreForm">
        <input type="text" id="choreDescription" placeholder="e.g. Take out the recycling" required>

        <select id="choreCategory" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Common Room">Common Room</option>
          <option value="Bathroom">Bathroom</option>
        </select>

        <select id="choreAssignee" required>
          <option value="" disabled selected>Assign Roommate</option>
        </select>

        <button type="submit">Add Chore</button>
      </form>
    </section>

    <section id="choreListSection" class="chore-board">
      <h2>Live Chore Board</h2>
      <div id="choreList"></div>
    </section>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
