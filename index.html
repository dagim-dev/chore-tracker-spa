<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roommate Chore Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="syncBanner" class="sync-banner" hidden role="status"></div>

  <div class="container">
    <header>
      <h1>🧹 Roommate Chore Tracker</h1>
    </header>

    <section id="leaderboard" class="leaderboard" aria-label="Roommate leaderboard"></section>

    <nav id="filterNav" class="filter-nav" aria-label="Filter chores"></nav>

    <section class="add-chore-panel">
      <h2>Add New Chore</h2>
      <p class="assignment-note">New chores are assigned right away for now (the 10-minute delay is off). Assignments rotate in order: Moutasim → Dhruv → Dagi → Issac.</p>
      <div id="suggestedChores" class="suggested-chores" aria-label="Suggested chores"></div>
      <form id="addChoreForm">
        <input type="text" id="choreDescription" placeholder="e.g. Take out the recycling" required>

        <select id="choreCategory" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Common Room">Common Room</option>
          <option value="Bathroom">Bathroom</option>
          <option value="Other">Other</option>
        </select>

        <button type="submit">Add Chore</button>
      </form>
    </section>

    <section id="choreListSection" class="chore-board">
      <h2>Live Chore Board</h2>
      <div id="choreList"></div>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
